<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <div class="nav flexcolumn pivotal">
        <h1>Rock Paper Scissors</h1>
        <p>try to beat the bot.</p>
        <h1 id = "scoreboard">0-0</h1>
    </div>
    
    <div class="hero pivotal">
        <div class="choices">
            <div class="teamA flex">
                <img src = "images/user.webp">
                <div class="options same flex">
                    <p id = "userChoicess">👊</p>
                </div>
            </div>
            <div class="teamB flex">
                <div class="options same flex">
                    <p id = "robotChoice">👊</p>
                </div>
                <img src = "images/robot.webp">
            </div>
        </div>
        <div class="text flex">
            <p id = "result">select to start</p>
        </div>
    </div>

    <div class="bottom flex">
        <button id = "rock">👊</button>
        <button id = "paper">🫱</button>
        <button id = "scissors">✌️</button>
    </div>
    
<script>

    let rock = document.getElementById("rock");
    let paper = document.getElementById("paper");
    let scissors = document.getElementById("scissors");

    let userChoiceHTML = document.getElementById("userChoicess");
    let robotChoiceHTML = document.getElementById("robotChoice");
    let resultHTML = document.getElementById("result");

    let scoreboardHTML = document.getElementById("scoreboard");


    let userScore = 0;
    let robotScore = 0;

    function simulateRPS(input){

        let randomNumber = Math.random();
        let randomOption = "";
        let result = "";

        if (randomNumber < (1/3)) {
            randomOption = "rock";
        }
        else if (randomNumber < 2/3) {
            randomOption = "paper";
        }
        else {
            randomOption = "scissors";
        }

        if (input === randomOption) {
            result = "tie";
        }
        else {
            if (input === "rock") {
                result = randomOption === "paper" ? "lose" : "win";
            }
            else if (input === "paper") {
                result = randomOption === "scissors" ? "lose" : "win";
            }
            else if (input === "scissors") {
                result = randomOption === "rock" ? "lose" : "win";
            }
        }

        //CONTINUE HERE TOMORROW LOGGING OFF 4:52 AM 11/2/2026
        
        if (result === "win") {
            userScore++;
        }
        else {
            robotScore++;
        }

        
        const toEmoji = {
            "rock": "👊",
            "paper": "🫱",
            "scissors": "✌️"
        }; 

        const color = {
            "win": "rgb(69, 207, 69)",
            "lose": "rgb(245, 43, 43)",
            "tie": "yellow"
        }

        userChoiceHTML.innerText = toEmoji[input];
        robotChoiceHTML.innerText = toEmoji[randomOption];
        resultHTML.innerHTML = `<p style = "color: ${color[result]};">${result}</p>`;
        scoreboardHTML.innerText = `${userScore} - ${robotScore}`;
        

        return 0;
        //COMMITTING AT 10:13 PM 11/2/2026

    }

    

    rock.addEventListener('click', () => {
        console.log(simulateRPS("rock"));
    });

    paper.addEventListener('click', () => {
        console.log(simulateRPS("paper"));
    });

    scissors.addEventListener('click', () => {
        console.log(simulateRPS("scissors"));
    });

</script>
</body>
</html>
